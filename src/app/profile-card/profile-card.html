<div class="p-6 bg-slate-900 rounded-2xl max-w-sm mx-auto text-white shadow-xl mt-10 border border-slate-800">
  <h2 class="text-xl font-bold text-blue-400 mb-4">🛒 Carrito Booksflea</h2>

  <p class="text-slate-300 font-medium">Libro: Angular Avanzado v18</p>
  <p class="text-emerald-400 font-semibold mb-6">Precio unitario: $ {{ precioLibro }}</p>

  <div class="flex items-center gap-6 mb-6 bg-slate-800 p-3 rounded-lg w-fit">
    <button class="bg-rose-600 hover:bg-rose-700 transition-colors px-4 py-1 rounded text-lg font-bold"
            (click)="quitar()">
      -
    </button>

    <span class="text-2xl font-bold w-6 text-center">{{cantidad()}}</span>

    <button class="bg-blue-600 hover:bg-blue-700 transition-colors px-4 py-1 rounded text-lg font-bold"
            (click)="agregar()">
      +
    </button>
  </div>

  <div class="border-t border-slate-700 pt-4">
    <p class="text-lg text-slate-300">
      Total a pagar:
      <span class="font-bold text-emerald-400 text-2xl ml-2">$ {{total()}}</span>
    </p>
  </div>
</div>
