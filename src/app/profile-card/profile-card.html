<div class="p-6 bg-slate-900 rounded-2xl shadow-xl w-full max-w-2xl mx-auto">
  <h2 class="text-2xl font-bold text-white mb-4">📚 Inventario Booksflea</h2>

  @for(libro of libros; track libro.titulo){
  <div class="p-4 border-b border-slate-700 flex justify-between items-center w-full max-w-2xl mx-auto">
    <div class="truncate max-w-[60%]">
      <h3 class="text-lg font-semibold text-blue-400 truncate">{{ libro.titulo }}</h3>
      <p class="text-sm text-slate-400">Autor: {{ libro.autor }}</p>
    </div>

    @if(libro.stock <= 10){ <div class="text-right">
      <p class="text-rose-500 text-xs font-bold uppercase">¡Pocas unidades!</p>

      <span class="bg-indigo-900 text-indigo-300 px-2 py-1 rounded text-xs">{{libro.categoria}}</span>
  </div>
  }
</div>
}
</div>
