@if (mostrarInfo) {
  <img [src]="avatarUrl" [alt]="nombreUsuario" class="w-24 h-24 rounded-full">
  <h2>{{ nombreUsuario }}</h2>
} @else {
  <p class="text-gray-500">La información del usuario está oculta.</p>
}

<button
  class="bg-blue-800 hover:bg-blue-500 text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-300 ml-7 cursor-pointer"
  (click)="saludar()">
  Saludar
</button>

<ul class="mt-4 list-disc list-inside text-left">
  @for (habilidad of habilidades; track habilidad) {
    <li class="text-slate-700 font-medium">{{ habilidad }}</li>
  }
</ul>
