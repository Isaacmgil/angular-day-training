<div class="p-6 bg-slate-900 rounded-2xl max-w-lg mx-auto text-white shadow-xl mt-10">
  <h2 class="text-2xl font-bold text-blue-400 mb-6">📚 Catálogo Filtrable</h2>

  <div class="flex gap-2 mb-6">
    <button class="px-4 py-1 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-semibold transition-colors"
      (click)="cambiarFiltro('Todas')">
      Todas
    </button>

    <button class="px-4 py-1 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-semibold transition-colors"
      (click)="cambiarFiltro('Fantasía')">
      Fantasía
    </button>

    <button class="px-4 py-1 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-semibold transition-colors"
      (click)="cambiarFiltro('Ficción')">
      Ficción
    </button>

    <button class="px-4 py-1 bg-slate-700 hover:bg-blue-600 rounded-full text-sm font-semibold transition-colors"
      (click)="cambiarFiltro('Autoayuda')">
      Autoayuda
    </button>
  </div>

  <div class="space-y-3">
    @for (libro of librosFiltrados(); track libro.titulo) {
    <div class="p-4 bg-slate-800 rounded-lg border border-slate-700 flex justify-between items-center">

      <span class="font-semibold text-slate-200"> {{libro.titulo}} </span>
      <span class="bg-indigo-900/50 text-indigo-300 px-2 py-1 rounded text-xs">{{libro.categoria}}</span>

    </div>
    } @empty {
    <p class="text-slate-400 italic text-center py-4">No hay libros en esta categoría.</p>
    }
  </div>

</div>
