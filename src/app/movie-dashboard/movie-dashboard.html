<div class="max-w-5xl mx-auto mt-10">
  <div class="p-6 bg-slate-900 rounded-2xl border border-slate-800 shadow-xl">
    <div class="flex justify-center items-center mb-6">
      <h2 class="text-xl text-center font-bold text-amber-400">Películas para agregar.</h2>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <input type="text" #inputTitulo placeholder="Nombre de la película"
        class="px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      <input type="text" #inputGenero placeholder="Genero de la película"
        class="px-4 py-2 rounded-lg border border-slate-700 bg-slate-800 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      <button
        class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-lg text-sm font-semibold transition-all shadow-lg"
        (click)="moviesservice.agregarPelicula(inputTitulo.value, inputGenero.value); inputTitulo.value = ''; inputGenero.value = ''">Guardar</button>
    </div>

    <div>
      @for(pelicula of moviesservice.listaPeliculas(); track pelicula.id){
      <div class="p-4 mt-5 bg-slate-800 rounded-xl flex justify-between items-center border border-slate-700">
        <div>
          <p class="font-bold text-slate-100" [class.line-through]="pelicula.vista"
            [class.text-slate-500]="pelicula.vista">
            {{ pelicula.titulo }}
          </p>
          <p class="text-sm font-mono text-slate-400">
            {{ pelicula.genero }}
          </p>
        </div>
        <div class="flex gap-2">
          <button
            class="bg-rose-500/10 text-rose-500 hover:bg-rose-600 hover:text-white px-3 py-2 rounded-lg text-sm font-semibold transition-all cursor-pointer"
            (click)="moviesservice.eliminarPelicula(pelicula.id)">
            Quitar
          </button>

          <button [disabled]="pelicula.vista"
            [class]="pelicula.vista
          ? 'bg-slate-700/50 text-slate-500 cursor-not-allowed px-3 py-2 rounded-lg text-sm font-semibold transition-all'
         : 'bg-green-500/10 text-green-500 hover:bg-green-600 hover:text-white px-3 py-2 rounded-lg text-sm    font-semibold transition-all cursor-pointer'"
            (click)="moviesservice.marcarComoVista(pelicula.id)">
            {{ pelicula.vista ? 'Vista ✓' : 'Marcar como vista' }}
          </button>
        </div>

      </div>
      } @empty {
      <div class="text-center mt-5 py-8 border-2 border-dashed border-slate-700 rounded-xl">
        <p class="text-slate-500 italic">No tienes ninguna película agregada.</p>
      </div>
      }
    </div>
  </div>
