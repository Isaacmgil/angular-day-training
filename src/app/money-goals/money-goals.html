<div class="p-6 bg-slate-900 rounded-2xl max-w-sm mx-auto text-white shadow-xl mt-10 border border-slate-800">
  <h2 class="text-xl font-bold text-blue-400 mb-4">🎯 Mis Metas Financieras</h2>

  <p class="text-emerald-400 font-semibold mb-6">Metas logradas: {{ metasCompletadas()}}</p>

  <div class="space-y-3">
    @for (meta of metas(); track meta.id) {
      <div class="p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700">
        <div>
          <p class="font-semibold">{{ meta.descripcion }}</p>
          <p class="text-sm text-slate-400">$ {{ meta.monto }}</p>
        </div>

        @if (!meta.lograda) {
          <button class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm transition-colors"
                  (click)="marcarLograda(meta.id)">
            Completar
          </button>
        } @else {
          <span class="text-emerald-400 font-bold text-sm">✅ Lograda</span>
        }
      </div>
    }
  </div>
</div>
